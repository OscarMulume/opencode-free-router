# Provider registry. A provider is active ONLY if all its environment variables exist.
# `necessite_carte: true` = signing up requires a bank card: disabled in this repository (ignored by the router and the bench).
# Model names must be checked against each provider's current official documentation; the bench only keeps models
# that the provider's /models endpoint actually announces.
# GitHub Models uses GITHUB_MODELS_TOKEN (a dedicated fine-grained token with `models: read`), never GITHUB_TOKEN.
_note: 'Registre des fournisseurs SANS CARTE BANCAIRE uniquement (mission routeur-qualite,
  Q2). Un fournisseur n''est actif que si ses variables d''environnement existent.
  Noms verifies dans la documentation du 2026-11-07 : Gemini 3.8 Flash / 3.6 Flash
  / 3.5 Flash-Lite / 3.1 Flash-Lite, Groq gpt-oss-120b / gpt-oss-20b / qwen3.8-27b,
  Ollama qwen2.5-coder:3b. GitHub Models est conserve pour compatibilite mais marque
  retire : le service a ete ferme le 30/07/2026 (docs GitHub). Sa variable reste GITHUB_MODELS_TOKEN,
  jamais GITHUB_TOKEN (reserve a gh). ''plafond_entree'' = limite d''entree connue
  en tokens, utilisee par la reduction de contexte (Q3).'
fournisseurs:
- nom: gemini-3.8-flash
  cles:
  - GEMINI_API_KEY
  base: https://generativelanguage.googleapis.com/v1beta/openai
  liste: https://generativelanguage.googleapis.com/v1beta/openai/models
  modeles:
  - gemini-3.8-flash
  prefixe_liste: models/
  litellm: gemini/{m}
  plafond_entree: 1000000
- nom: gemini-3.6-flash
  cles:
  - GEMINI_API_KEY
  base: https://generativelanguage.googleapis.com/v1beta/openai
  liste: https://generativelanguage.googleapis.com/v1beta/openai/models
  modeles:
  - gemini-3.6-flash
  prefixe_liste: models/
  litellm: gemini/{m}
  plafond_entree: 1000000
- nom: gemini-3.5-flash-lite
  cles:
  - GEMINI_API_KEY
  base: https://generativelanguage.googleapis.com/v1beta/openai
  liste: https://generativelanguage.googleapis.com/v1beta/openai/models
  modeles:
  - gemini-3.5-flash-lite
  prefixe_liste: models/
  litellm: gemini/{m}
  plafond_entree: 1000000
- nom: gemini-3.1-flash-lite
  cles:
  - GEMINI_API_KEY
  base: https://generativelanguage.googleapis.com/v1beta/openai
  liste: https://generativelanguage.googleapis.com/v1beta/openai/models
  modeles:
  - gemini-3.1-flash-lite
  prefixe_liste: models/
  litellm: gemini/{m}
  plafond_entree: 1000000
- nom: groq
  cles:
  - GROQ_API_KEY
  base: https://api.groq.com/openai/v1
  liste: https://api.groq.com/openai/v1/models
  modeles:
  - openai/gpt-oss-120b
  - openai/gpt-oss-20b
  - qwen/qwen3.8-27b
  litellm: groq/{m}
  plafond_entree: 8000
- nom: github-models
  cles:
  - GITHUB_MODELS_TOKEN
  base: https://models.github.ai/inference
  liste: https://models.github.ai/catalog/models
  modeles:
  - openai/gpt-4.1-mini
  - openai/gpt-4.1
  litellm: github/{m}
  openai_compat: true
  plafond_entree: 8000
  retire: true
  note: 'Service retire le 30/07/2026 (docs.github.com/en/github-models) : le code
    reste pret, mais aucun appel ne peut reussir.'
- nom: ollama
  cles: []
  base: http://localhost:11434/v1
  liste: null
  modeles:
  - qwen2.5-coder:3b
  - qwen2.5-coder:7b
  litellm: ollama_chat/{m}
  local: true
  plafond_entree: 32768
