name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint YAML
        run: |
          pip install yamllint PyYAML
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" scripts/providers.yaml litellm/config.yaml integrations/*.yml integrations/*.yaml
      - name: Render test without keys
        run: python -m unittest discover tests -v
      - name: Python syntax
        run: python -m py_compile scripts/*.py litellm/router_log.py integrations/client-openai.py
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
